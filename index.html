<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="교대근무 일정과 메모를 간편하게 관리하는 개인용 달력">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/shiftcal.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/shiftcal-180.png">
  <link rel="stylesheet" href="styles.css">
  <style>
    .app-shell { padding-bottom: 8px; }
    .bottom-nav { padding-bottom: calc(4px + env(safe-area-inset-bottom)); }
    .bottom-nav-item { padding-bottom: 3px; }
    .allowance-card { margin-bottom: 14px; background: #f8fbff; }
    .allowance-card .stats-cards { margin: 0; }
    .allowance-note { margin: 12px 1px 0; color: #718198; font-size: 11px; line-height: 1.55; }
    .field-unit { display: block; margin-top: 5px; color: #7d8ca0; font-weight: 600; }
    .compact-hint { margin: 8px 0 0; }
  </style>
  <title>ShiftCal Web</title>
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div><p class="eyebrow">나만의 교대근무 달력</p><h1>ShiftCal</h1></div>
      <button id="settingsButton" class="icon-button" aria-label="설정">⚙️</button>
    </header>

    <section id="calendarView" class="app-view">
      <section class="today-card" id="todayCard"></section>
      <section class="toolbar" aria-label="달력 탐색">
        <button id="previousMonth" class="nav-button" aria-label="이전 달">‹</button>
        <button id="todayButton" class="today-button">오늘</button>
        <h2 id="monthTitle"></h2>
        <button id="nextMonth" class="nav-button" aria-label="다음 달">›</button>
      </section>
      <section class="calendar-card">
        <div class="weekday-row"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
        <div id="calendarGrid" class="calendar-grid" aria-live="polite"></div>
      </section>
      <section class="legend" id="legend"></section>
    </section>

    <section id="notesView" class="app-view hidden-view">
      <div class="view-heading"><div><p class="eyebrow">날짜별 기록</p><h2>메모</h2></div><span id="notesCount" class="count-badge"></span></div>
      <div id="notesList" class="notes-list"></div>
    </section>

    <section id="statsView" class="app-view hidden-view">
      <div class="view-heading"><div><p class="eyebrow">월간 요약</p><h2 id="statsTitle">통계</h2></div><span id="statsPattern" class="small-badge"></span></div>
      <div id="statsCards" class="stats-cards"></div>
      <div class="breakdown-card allowance-card">
        <h3>초과수당 예상</h3>
        <div id="allowanceCards" class="stats-cards"></div>
        <p id="allowanceNote" class="allowance-note"></p>
      </div>
      <div class="breakdown-card"><h3>근무 유형별 현황</h3><div id="shiftBreakdown"></div></div>
    </section>

    <p class="privacy-note">일정과 설정은 이 브라우저에만 저장됩니다.</p>
    <nav class="bottom-nav" aria-label="주요 메뉴">
      <button class="bottom-nav-item active" data-view="calendarView"><span>▣</span><b>달력</b></button>
      <button class="bottom-nav-item" data-view="notesView"><span>✎</span><b>메모</b></button>
      <button class="bottom-nav-item" data-view="statsView"><span>▤</span><b>통계</b></button>
      <button class="bottom-nav-item" id="bottomSettings"><span>⚙</span><b>설정</b></button>
    </nav>
  </main>

  <dialog id="settingsDialog">
    <form method="dialog" id="settingsForm" class="settings-form">
      <div class="dialog-header"><h2>근무 설정</h2><button value="cancel" class="close-button" aria-label="닫기">×</button></div>
      <label>근무 패턴<select id="patternSelect"></select></label>
      <label class="anchor-label">기준일<input id="anchorDate" type="date" required></label>
      <label>기준일 근무<select id="anchorIndex"></select></label>
      <label>근무 1회당 수당 제외시간<input id="allowanceBreakMinutes" type="number" min="0" max="1440" step="10" inputmode="numeric" value="0"><small class="field-unit">분</small></label>
      <p class="form-hint compact-hint">식사·수면·휴식 중 실제 근무시간으로 인정되지 않는 시간을 입력하세요. 기관에서 근무시간으로 인정하면 0분으로 둡니다.</p>
      <div class="form-actions"><button value="cancel" class="secondary-button">취소</button><button id="saveSettings" value="default" class="primary-button">저장</button></div>
      <hr>
      <div class="backup-actions"><button type="button" id="exportButton" class="secondary-button">백업 내보내기</button><label class="file-button secondary-button">백업 가져오기<input id="importInput" type="file" accept="application/json"></label></div>
      <p class="form-hint">날짜를 선택하면 해당 날짜의 근무와 메모를 따로 설정할 수 있습니다.</p>
    </form>
  </dialog>

  <dialog id="overrideDialog">
    <form method="dialog" id="overrideForm" class="settings-form">
      <div class="dialog-header"><h2 id="overrideTitle">날짜 근무 변경</h2><button value="cancel" class="close-button" aria-label="닫기">×</button></div>
      <label>근무<select id="overrideSelect"></select></label>
      <div id="customShiftFields" class="custom-shift-fields hidden-view">
        <label>근무 이름<input id="customShiftName" maxlength="20" placeholder="예: 자원근무, 교육, 출장"></label>
        <div class="time-fields"><label>시작<input id="customStart" type="time" value="09:00"></label><label>종료<input id="customEnd" type="time" value="18:00"></label></div>
        <label class="color-label">근무 색상<input id="customColor" type="color" value="#607D8B"></label>
        <label class="checkbox-label"><input id="customIsOff" type="checkbox"> 근무 시간이 없는 일정 (연가·공가 등)</label>
      </div>
      <label>메모<textarea id="noteInput" rows="4" maxlength="500" placeholder="이 날짜에 남길 메모를 입력해 주세요"></textarea></label>
      <div class="form-actions"><button value="cancel" class="secondary-button">취소</button><button id="clearOverride" type="button" class="danger-button">근무 변경 해제</button><button id="saveOverride" value="default" class="primary-button">저장</button></div>
    </form>
  </dialog>
  <script src="shift-engine.js"></script>
  <script src="stats-engine.js"></script>
  <script src="holiday-engine.js"></script>
  <script src="app-utils.js"></script>
  <script src="storage.js"></script>
  <script src="app.js"></script>
</body>
</html>
